spring:
  config:
    activate:
      on-profile: test

  application:
    name: 4vidia-auth-test

  data:
    redis:
      # ❌ 실 Redis 사용 금지
      # 👉 테스트에서는 Embedded Redis 또는 Mock 사용
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 1000ms

jwt:
  # ✅ 테스트 전용 더미 키
  secret: test-jwt-secret-key-for-unit-test-only

jwe:
  secret: test-jwe-secret-key-32bytes-long!!

server:
  port: 0  # ✅ 랜덤 포트 (TestContext 충돌 방지)

eureka:
  client:
    # ❌ 테스트에서는 Eureka 연동 금지
    enabled: false
    fetch-registry: false
    register-with-eureka: false

app:
  cookie:
    secure: false
    domain: localhost

payco:
  # ❌ 실제 OAuth 절대 호출 금지
  # 👉 Controller/Service 테스트 시 Mock 처리
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost/test/oauth/callback
